[project]
name = "standalone-reports"
version = "1.0.0"
description = "Standalone report generator for omnichannel data"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "xlsxwriter>=3.1.9",
    "rich>=13.7.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "fpdf2>=2.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["application/", "domain/", "infrastructure/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
